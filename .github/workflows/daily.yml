name: Daily Tech Digest

on:
  schedule:
    # 5 AM UTC = 6 AM Berlin (CET winter) / 7 AM (CEST summer)
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Run mode'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - run-once
      article_count:
        description: 'Number of articles (for run-once mode)'
        required: false
        default: '10'
        type: string
      delivery:
        description: 'Delivery method'
        required: false
        default: 'telegram'
        type: choice
        options:
          - none
          - email
          - telegram
          - both
      build_web:
        description: 'Build web pages'
        required: false
        default: true
        type: boolean
      web_keep_days:
        description: 'Days to keep in web archive'
        required: false
        default: '7'
        type: string

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for GitHub Pages deployment
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Determine run command
        id: cmd
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.run_mode }}" == "run-once" ]; then
              CMD="python -m src.main --run-once --articles ${{ inputs.article_count }}"
            else
              CMD="python -m src.main --type daily"
            fi
            CMD="$CMD --delivery ${{ inputs.delivery }}"
            
            # Add web build options for manual triggers
            if [ "${{ inputs.build_web }}" == "true" ]; then
              CMD="$CMD --build-web --web-keep-days ${{ inputs.web_keep_days }}"
            fi
          else
            # Scheduled run: always build web pages
            CMD="python -m src.main --type daily --delivery both --build-web --web-keep-days 7"
          fi
          echo "command=$CMD" >> $GITHUB_OUTPUT
          echo "Running: $CMD"
      
      - name: Generate digest
        run: ${{ steps.cmd.outputs.command }}
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      
      - name: Upload article cache for weekly digest
        if: github.event_name == 'schedule' || inputs.run_mode == 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: articles-${{ github.run_id }}
          path: cache/articles-*.json
          retention-days: 8
          if-no-files-found: warn
      
      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digest-${{ github.run_id }}
          path: output/*.epub
          retention-days: 7
          if-no-files-found: warn
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.build_web == true)
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy digest for ${{ github.run_id }}'
